<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסך בניין</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a257;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,162,87,0.15);
    --gold-border: rgba(201,162,87,0.22);
    --surface: rgba(15,10,5,0.72);
    --surface-hover: rgba(15,10,5,0.82);
    --text: #ede0cc;
    --text-dim: #7a6e58;
    --bar-bg: rgba(10,7,3,0.90);
  }

  /* ===== ערכות נושא ===== */
  /* wood (ברירת מחדל) */
  body.theme-wood {
    background-image: linear-gradient(rgba(0,0,0,0.68),rgba(0,0,0,0.68)), url('/wood-bg.webp');
    background-size: cover; background-position: center;
  }
  /* navy — כחול כהה יוקרתי */
  body.theme-navy {
    --gold: #7eb8d4; --gold-light: #a8d4e8;
    --gold-dim: rgba(126,184,212,0.13); --gold-border: rgba(126,184,212,0.25);
    --surface: rgba(5,15,35,0.75); --surface-hover: rgba(5,15,35,0.88);
    --text: #ddeeff; --text-dim: #5a7a99; --bar-bg: rgba(3,10,25,0.92);
    background: radial-gradient(ellipse at 60% 0%, #0d2a4a 0%, #050f1e 60%, #020810 100%);
  }
  /* white — מינימל בהיר */
  body.theme-white {
    --gold: #1a3a6e; --gold-light: #2a4e8e;
    --gold-dim: rgba(26,58,110,0.10); --gold-border: rgba(26,58,110,0.22);
    --surface: rgba(255,255,255,0.65); --surface-hover: rgba(255,255,255,0.85);
    --text: #1a2340; --text-dim: #6a7a99; --bar-bg: rgba(240,244,255,0.95);
    background: linear-gradient(160deg, #e8edf8 0%, #f4f7ff 50%, #dfe5f5 100%);
  }
  body.theme-white .top-bar,
  body.theme-white .news-bar { background: var(--bar-bg); border-color: var(--gold-border); }
  body.theme-white .biz-item { border-right-color: var(--gold); }
  body.theme-white .news-label { background: var(--gold); color: #fff; }
  /* green — יוקרתי ירוק */
  body.theme-green {
    --gold: #c9a257; --gold-light: #e8c97a;
    --gold-dim: rgba(201,162,87,0.13); --gold-border: rgba(201,162,87,0.22);
    --surface: rgba(5,25,15,0.75); --surface-hover: rgba(5,25,15,0.88);
    --text: #d8ede0; --text-dim: #527a60; --bar-bg: rgba(3,15,8,0.92);
    background: radial-gradient(ellipse at 40% 10%, #0d3320 0%, #061a0e 55%, #030d06 100%);
  }
  /* charcoal — אפור מודרני */
  body.theme-charcoal {
    --gold: #e0e0e0; --gold-light: #ffffff;
    --gold-dim: rgba(220,220,220,0.10); --gold-border: rgba(220,220,220,0.20);
    --surface: rgba(255,255,255,0.05); --surface-hover: rgba(255,255,255,0.09);
    --text: #f0f0f0; --text-dim: #707070; --bar-bg: rgba(10,10,10,0.95);
    background: linear-gradient(160deg, #1c1c1c 0%, #141414 50%, #0e0e0e 100%);
  }

  body {
    color: var(--text);
    font-family: 'Heebo', Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== שורת כותרת עליונה ===== */
  .top-bar {
    background: var(--bar-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 72px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--gold-border);
    position: relative;
  }
  .top-bar::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to left, transparent, var(--gold), transparent);
  }

  .building-name {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    white-space: nowrap;
    margin-left: 24px;
    flex-shrink: 0;
    color: var(--gold-light);
  }

  .datetime {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex-shrink: 0;
    min-width: 130px;
  }
  .datetime .time {
    font-size: 1.9rem;
    font-weight: 300;
    line-height: 1;
    color: var(--gold-light);
    letter-spacing: 3px;
  }
  .datetime .date {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  /* עדכוני בניין בגלילה */
  .updates-ticker-wrap {
    flex: 1;
    overflow: hidden;
    margin: 0 24px;
    position: relative;
    direction: ltr;
  }
  .updates-ticker-wrap::before,
  .updates-ticker-wrap::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 48px;
    z-index: 2;
  }
  .updates-ticker-wrap::before { left: 0; background: linear-gradient(to right, var(--bar-bg), transparent); }
  .updates-ticker-wrap::after  { right: 0; background: linear-gradient(to left, var(--bar-bg), transparent); }

  .updates-ticker {
    display: inline-block;
    white-space: nowrap;
    direction: ltr;
    will-change: transform;
  }
  .update-item {
    display: inline-flex;
    align-items: center;
    margin-right: 64px;
    font-size: 0.9rem;
    color: rgba(232,201,122,0.7);
    font-weight: 300;
    letter-spacing: 0.3px;
    direction: rtl;
  }
  .update-item::before {
    content: '◈';
    margin-left: 10px;
    color: var(--gold);
    font-size: 0.7rem;
  }

  /* ===== גוף ראשי ===== */
  .main-body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.78fr;
    gap: 14px;
    padding: 14px;
    min-height: 0;
  }

  /* === עסקים === */
  .businesses-panel {
    background: var(--surface);
    border: 1px solid var(--gold-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    background: linear-gradient(135deg, rgba(201,162,87,0.12), rgba(201,162,87,0.05));
    border-bottom: 1px solid var(--gold-border);
    color: var(--gold-light);
    padding: 13px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .biz-list {
    flex: 1;
    overflow: hidden;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .biz-scroll {
    animation: scrollUp 60s linear infinite;
  }
  .biz-scroll:hover { animation-play-state: paused; }
  @keyframes scrollUp {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  .biz-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 7px;
    background: var(--surface);
    border: 1px solid rgba(201,162,87,0.12);
    border-right: 3px solid var(--gold);
    border-radius: 10px;
    transition: background 0.2s, border-color 0.2s;
  }
  .biz-item.alt {
    background: rgba(201,162,87,0.06);
  }
  .biz-item:hover {
    background: var(--surface-hover);
    border-color: var(--gold-border);
  }
  .biz-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }
  .biz-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }
  .biz-desc {
    font-size: 0.62rem;
    font-weight: 300;
    color: var(--text-dim);
    line-height: 1.2;
  }
  .biz-room {
    background: var(--gold-dim);
    color: var(--gold-light);
    font-size: 0.88rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--gold-border);
    min-width: 60px;
    text-align: center;
    flex-shrink: 0;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  /* === פרסומות === */
  .promo-panel {
    background: #050608;
    border: 1px solid var(--gold-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .promo-content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .ad-slide {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    z-index: 1;
  }
  .ad-slide.active { display: flex; }
  .ad-slide img  { width: 100%; height: 100%; object-fit: cover; }
  .ad-slide video { width: 100%; height: 100%; object-fit: cover; }
  .no-ads {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: linear-gradient(160deg, #09090f 0%, #0e0c14 50%, #08080e 100%);
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  .no-ads::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(201,162,87,0.07) 0%, transparent 65%);
  }
  .no-ads-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
  }
  .no-ads-label {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 22px;
    opacity: 0.7;
  }
  .no-ads-main {
    font-size: 1.55rem;
    font-weight: 300;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }
  .no-ads-phone {
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 2px;
    background: rgba(201,162,87,0.08);
    padding: 16px 32px;
    border-radius: 12px;
    border: 1px solid var(--gold-border);
    display: inline-block;
  }
  .no-ads-sub {
    margin-top: 20px;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 1.5px;
  }
  .ad-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px;
    flex-shrink: 0;
  }
  .ad-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(201,162,87,0.2);
    transition: background 0.3s;
  }
  .ad-dot.active { background: var(--gold); }

  /* שורת פרסום קבועה */
  .promo-contact-bar {
    background: rgba(201,162,87,0.08);
    border-top: 1px solid var(--gold-border);
    padding: 7px 16px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--gold);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  /* ===== רצועת חדשות תחתית ===== */
  .news-bar {
    background: var(--bar-bg);
    border-top: 1px solid var(--gold-border);
    color: var(--text);
    height: 44px;
    display: flex;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .news-label {
    background: var(--gold);
    color: #000;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0 18px;
    height: 100%;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    letter-spacing: 1.5px;
  }
  .news-ticker-wrap {
    flex: 1;
    overflow: hidden;
    margin: 0 14px;
    direction: ltr;
  }
  .news-ticker {
    display: inline-block;
    white-space: nowrap;
    direction: ltr;
    font-size: 0.88rem;
    color: rgba(237,232,220,0.65);
    font-weight: 300;
    will-change: transform;
  }
  .news-item { display: inline-flex; align-items: center; gap: 8px; margin-right: 64px; direction: rtl; }
  .news-item::before { content: '◆'; color: var(--gold); font-size: 0.65rem; flex-shrink: 0; }
  .news-time {
    background: var(--gold-dim);
    color: var(--gold-light);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--gold-border);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- שורה עליונה -->
<div class="top-bar">
  <div class="datetime">
    <div class="time" id="clock">00:00</div>
    <div class="date" id="dateDisplay"></div>
  </div>

  <div class="updates-ticker-wrap">
    <div class="updates-ticker" id="updatesTicker">
      <span class="update-item">ברוכים הבאים לבניין</span>
      <span class="update-item">ברוכים הבאים לבניין</span>
    </div>
  </div>

  <div class="building-name" id="buildingName">◈ מרכז עסקים | התע"ש 10</div>
</div>

<!-- גוף ראשי -->
<div class="main-body">

  <!-- עסקים -->
  <div class="businesses-panel">
    <div class="panel-header">✦ מדריך עסקים ומשרדים</div>
    <div class="biz-list">
      <div class="biz-scroll" id="bizScroll"></div>
    </div>
  </div>

  <!-- פרסומות -->
  <div class="promo-panel">
    <div class="promo-content">
      <div id="promoPlaceholder" class="no-ads">
        <div class="no-ads-inner">
          <div class="no-ads-label">מקום פרסום</div>
          <div class="no-ads-main">פרסמו את העסק שלכם<br>על מסך הבניין</div>
          <div class="no-ads-phone">052-6060848</div>
          <div class="no-ads-sub">לפרסום כאן חייגו</div>
        </div>
      </div>
      <div id="adSlides"></div>
    </div>
    <div class="ad-dots" id="adDots"></div>
    <div class="promo-contact-bar">לפרסום העסק שלכם על מסך הבניין חייגו ✦ 052-6060848</div>
  </div>

</div>

<!-- חדשות ynet -->
<div class="news-bar">
  <div class="news-label">ynet חדשות</div>
  <div class="news-ticker-wrap">
    <div class="news-ticker" id="newsTicker">טוען חדשות...</div>
  </div>
</div>

<script>
  // שם בניין
  async function loadBuildingName() {
    const data = await fetch('/api/settings').then(r => r.json()).catch(() => ({}));
    if (data.buildingName) document.getElementById('buildingName').textContent = '◈ ' + data.buildingName;
  }
  loadBuildingName();
  setInterval(loadBuildingName, 30 * 1000);

  // ערכת נושא
  async function loadTheme() {
    const data = await fetch('/api/theme').then(r => r.json()).catch(() => ({ theme: 'wood' }));
    document.body.className = 'theme-' + (data.theme || 'wood');
  }
  loadTheme();
  setInterval(loadTheme, 30 * 1000);

  // שעון ותאריך
  const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m;
    document.getElementById('dateDisplay').textContent =
      `יום ${DAYS[now.getDay()]} | ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // עסקים
  async function loadBusinesses() {
    const data = await fetch('/api/businesses').then(r => r.json());
    const el = document.getElementById('bizScroll');
    if (!data.length) { el.innerHTML = '<div style="padding:20px;color:#aaa;text-align:center">אין עסקים עדיין</div>'; return; }
    const items = data.map((b, i) => `
      <div class="biz-item${i % 2 === 1 ? ' alt' : ''}">
        <div class="biz-info">
          <div class="biz-name">${b.name}</div>
          ${b.description ? `<div class="biz-desc">${b.description}</div>` : ''}
        </div>
        <div class="biz-room">חדר ${b.office}</div>
      </div>
    `).join('');
    el.innerHTML = items + items; // כפול לאנימציה חלקה
  }
  loadBusinesses();
  setInterval(loadBusinesses, 60000);

  // עדכוני בניין
  async function loadUpdates() {
    const data = await fetch('/api/updates').then(r => r.json());
    if (!data.length) return;
    const items = data.map(u => `<span class="update-item">${u.text}</span>`).join('');
    updatesTicker.setContent(items + items);
  }
  loadUpdates();
  setInterval(loadUpdates, 5 * 60 * 1000);

  // פרסומות
  let adIndex = 0, adTimer = null, adsData = [];
  async function loadAds() {
    adsData = await fetch('/api/ads').then(r => r.json());
    renderAds();
  }
  function renderAds() {
    const container = document.getElementById('adSlides');
    const dots = document.getElementById('adDots');
    if (!adsData.length) {
      container.innerHTML = '';
      dots.innerHTML = '';
      return;
    }
    container.innerHTML = adsData.map((ad, i) => `
      <div class="ad-slide ${i===0?'active':''}" id="ad-${i}">
        ${ad.type==='video'
          ? `<video src="${ad.url}" autoplay muted loop></video>`
          : `<img src="${ad.url}" alt="${ad.title}">`}
      </div>
    `).join('');
    dots.innerHTML = adsData.map((_,i) =>
      `<div class="ad-dot ${i===0?'active':''}" id="dot-${i}"></div>`).join('');
    adIndex = 0;
    if (adTimer) clearTimeout(adTimer);
    scheduleNext();
  }
  function scheduleNext() {
    if (!adsData.length) return;
    adTimer = setTimeout(() => {
      document.getElementById('ad-'+adIndex)?.classList.remove('active');
      document.getElementById('dot-'+adIndex)?.classList.remove('active');
      adIndex = (adIndex+1) % adsData.length;
      document.getElementById('ad-'+adIndex)?.classList.add('active');
      document.getElementById('dot-'+adIndex)?.classList.add('active');
      scheduleNext();
    }, (adsData[adIndex].duration||6)*1000);
  }
  loadAds();
  setInterval(loadAds, 5*60*1000);

  // חדשות ynet — גלילה חלקה ואינסופית עם requestAnimationFrame
  function fmtTime(pubDate) {
    if (!pubDate) return '';
    const d = new Date(pubDate);
    if (isNaN(d)) return '';
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  // מנוע גלילה גנרי לשני הסרגלים
  function createTicker(elId, speed) {
    let x = 0, halfW = 0, raf = null;
    const el = () => document.getElementById(elId);
    function step(lastTs) {
      return function(ts) {
        const dt = Math.min((ts - lastTs) / 1000, 0.1);
        x -= speed * dt; // speed חיובי = ימין לשמאל, שלילי = שמאל לימין
        if (halfW > 0) {
          if (speed > 0 && x <= -halfW) x += halfW; // ימין לשמאל
          if (speed < 0 && x >= 0)      x -= halfW; // שמאל לימין
        }
        el().style.transform = `translateX(${x}px)`;
        raf = requestAnimationFrame(step(ts));
      };
    }
    function start() {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(ts => { raf = requestAnimationFrame(step(ts)); });
    }
    function setContent(html) {
      el().innerHTML = html;
      requestAnimationFrame(() => {
        halfW = el().scrollWidth / 2;
        if (speed < 0) x = -halfW; // שמאל לימין — מתחיל מהסוף
      });
    }
    return { start, setContent };
  }

  const newsTicker  = createTicker('newsTicker',    -50);
  const updatesTicker = createTicker('updatesTicker', -50);
  newsTicker.start();
  updatesTicker.start();

  async function loadNews() {
    const data = await fetch('/api/news').then(r => r.json()).catch(() => []);
    if (!data.length) return;
    const makeItems = () => data.map(n => {
      const t = typeof n === 'object' ? n.title : n;
      const time = typeof n === 'object' ? fmtTime(n.pubDate) : '';
      return `<span class="news-item">${time ? `<span class="news-time">${time}</span>` : ''}${t}</span>`;
    }).join('');
    newsTicker.setContent(makeItems() + makeItems());
  }

  loadNews();
  setInterval(loadNews, 2 * 60 * 1000);

  // רענון מלא של הדף כל 10 דקות
  setInterval(() => location.reload(), 10 * 60 * 1000);
</script>
</body>
</html>
