<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסך בניין</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a257;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,162,87,0.15);
    --gold-border: rgba(201,162,87,0.22);
    --surface: rgba(15,10,5,0.72);
    --surface-hover: rgba(15,10,5,0.82);
    --text: #ede0cc;
    --text-dim: #7a6e58;
    --bar-bg: rgba(10,7,3,0.90);
  }

  body {
    background-color: #1c1208;
    background-image:
      repeating-linear-gradient(
        89deg,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.06) 3px,
        rgba(0,0,0,0.06) 4px,
        transparent 4px,
        transparent 9px,
        rgba(255,180,80,0.025) 9px,
        rgba(255,180,80,0.025) 11px,
        transparent 11px,
        transparent 18px,
        rgba(0,0,0,0.04) 18px,
        rgba(0,0,0,0.04) 20px
      ),
      repeating-linear-gradient(
        91deg,
        transparent 0px,
        transparent 40px,
        rgba(0,0,0,0.03) 40px,
        rgba(0,0,0,0.03) 42px
      ),
      linear-gradient(
        175deg,
        #2a1c0a 0%,
        #1c1208 18%,
        #231508 35%,
        #1a1007 50%,
        #251a0b 65%,
        #1c1208 80%,
        #201409 100%
      );
    color: var(--text);
    font-family: 'Heebo', Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== שורת כותרת עליונה ===== */
  .top-bar {
    background: var(--bar-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 72px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--gold-border);
    position: relative;
  }
  .top-bar::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to left, transparent, var(--gold), transparent);
  }

  .building-name {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    white-space: nowrap;
    margin-left: 24px;
    flex-shrink: 0;
    color: var(--gold-light);
  }

  .datetime {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex-shrink: 0;
    min-width: 130px;
  }
  .datetime .time {
    font-size: 1.9rem;
    font-weight: 300;
    line-height: 1;
    color: var(--gold-light);
    letter-spacing: 3px;
  }
  .datetime .date {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  /* עדכוני בניין בגלילה */
  .updates-ticker-wrap {
    flex: 1;
    overflow: hidden;
    margin: 0 24px;
    position: relative;
  }
  .updates-ticker-wrap::before,
  .updates-ticker-wrap::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 48px;
    z-index: 2;
  }
  .updates-ticker-wrap::before { right: 0; background: linear-gradient(to left, var(--bar-bg), transparent); }
  .updates-ticker-wrap::after  { left: 0;  background: linear-gradient(to right, var(--bar-bg), transparent); }

  .updates-ticker {
    display: flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    animation: scrollRight 40s linear infinite;
  }
  @keyframes scrollRight {
    from { transform: translateX(0%); }
    to   { transform: translateX(-50%); }
  }
  .update-item {
    display: inline-flex;
    align-items: center;
    margin-left: 64px;
    font-size: 0.9rem;
    color: rgba(232,201,122,0.7);
    font-weight: 300;
    letter-spacing: 0.3px;
  }
  .update-item::before {
    content: '◈';
    margin-left: 10px;
    color: var(--gold);
    font-size: 0.7rem;
  }

  /* ===== גוף ראשי ===== */
  .main-body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.78fr;
    gap: 14px;
    padding: 14px;
    min-height: 0;
  }

  /* === עסקים === */
  .businesses-panel {
    background: var(--surface);
    border: 1px solid var(--gold-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    background: linear-gradient(135deg, rgba(201,162,87,0.12), rgba(201,162,87,0.05));
    border-bottom: 1px solid var(--gold-border);
    color: var(--gold-light);
    padding: 13px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .biz-list {
    flex: 1;
    overflow: hidden;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .biz-scroll {
    animation: scrollUp 60s linear infinite;
  }
  .biz-scroll:hover { animation-play-state: paused; }
  @keyframes scrollUp {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  .biz-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 7px;
    background: var(--surface);
    border: 1px solid rgba(201,162,87,0.12);
    border-right: 3px solid var(--gold);
    border-radius: 10px;
    transition: background 0.2s, border-color 0.2s;
  }
  .biz-item:hover {
    background: var(--surface-hover);
    border-color: var(--gold-border);
  }
  .biz-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }
  .biz-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }
  .biz-desc {
    font-size: 0.62rem;
    font-weight: 300;
    color: var(--text-dim);
    line-height: 1.2;
  }
  .biz-room {
    background: var(--gold-dim);
    color: var(--gold-light);
    font-size: 0.68rem;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid var(--gold-border);
    min-width: 52px;
    text-align: center;
    flex-shrink: 0;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  /* === פרסומות === */
  .promo-panel {
    background: #050608;
    border: 1px solid var(--gold-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .promo-content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .ad-slide {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    z-index: 1;
  }
  .ad-slide.active { display: flex; }
  .ad-slide img  { width: 100%; height: 100%; object-fit: cover; }
  .ad-slide video { width: 100%; height: 100%; object-fit: cover; }
  .no-ads {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: linear-gradient(160deg, #09090f 0%, #0e0c14 50%, #08080e 100%);
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  .no-ads::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(201,162,87,0.07) 0%, transparent 65%);
  }
  .no-ads-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px;
  }
  .no-ads-label {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 22px;
    opacity: 0.7;
  }
  .no-ads-main {
    font-size: 1.55rem;
    font-weight: 300;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }
  .no-ads-phone {
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 2px;
    background: rgba(201,162,87,0.08);
    padding: 16px 32px;
    border-radius: 12px;
    border: 1px solid var(--gold-border);
    display: inline-block;
  }
  .no-ads-sub {
    margin-top: 20px;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 1.5px;
  }
  .ad-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px;
    flex-shrink: 0;
  }
  .ad-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(201,162,87,0.2);
    transition: background 0.3s;
  }
  .ad-dot.active { background: var(--gold); }

  /* ===== רצועת חדשות תחתית ===== */
  .news-bar {
    background: var(--bar-bg);
    border-top: 1px solid var(--gold-border);
    color: var(--text);
    height: 44px;
    display: flex;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .news-label {
    background: var(--gold);
    color: #000;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0 18px;
    height: 100%;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    letter-spacing: 1.5px;
  }
  .news-ticker-wrap {
    flex: 1;
    overflow: hidden;
    margin: 0 14px;
  }
  .news-ticker {
    display: inline-block;
    white-space: nowrap;
    animation: newsTicker 80s linear infinite;
    font-size: 0.88rem;
    color: rgba(237,232,220,0.65);
    font-weight: 300;
  }
  @keyframes newsTicker {
    from { transform: translateX(0%); }
    to   { transform: translateX(-50%); }
  }
  .news-item { display: inline-block; margin-left: 64px; }
  .news-item::before { content: '◆  '; color: var(--gold); font-size: 0.65rem; }
</style>
</head>
<body>

<!-- שורה עליונה -->
<div class="top-bar">
  <div class="datetime">
    <div class="time" id="clock">00:00</div>
    <div class="date" id="dateDisplay"></div>
  </div>

  <div class="updates-ticker-wrap">
    <div class="updates-ticker" id="updatesTicker">
      <span class="update-item">ברוכים הבאים לבניין</span>
      <span class="update-item">ברוכים הבאים לבניין</span>
    </div>
  </div>

  <div class="building-name">🏢 מרכז עסקים | התע"ש 10</div>
</div>

<!-- גוף ראשי -->
<div class="main-body">

  <!-- עסקים -->
  <div class="businesses-panel">
    <div class="panel-header">📋 מדריך עסקים ומשרדים</div>
    <div class="biz-list">
      <div class="biz-scroll" id="bizScroll"></div>
    </div>
  </div>

  <!-- פרסומות -->
  <div class="promo-panel">
    <div class="promo-content">
      <div id="promoPlaceholder" class="no-ads">
        <div class="no-ads-inner">
          <div class="no-ads-label">מקום פרסום</div>
          <div class="no-ads-main">פרסמו את העסק שלכם<br>על מסך הבניין</div>
          <div class="no-ads-phone">052-6060848</div>
          <div class="no-ads-sub">לפרסום כאן חייגו</div>
        </div>
      </div>
      <div id="adSlides"></div>
    </div>
    <div class="ad-dots" id="adDots"></div>
  </div>

</div>

<!-- חדשות ynet -->
<div class="news-bar">
  <div class="news-label">ynet חדשות</div>
  <div class="news-ticker-wrap">
    <div class="news-ticker" id="newsTicker">טוען חדשות...</div>
  </div>
</div>

<script>
  // שעון ותאריך
  const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m;
    document.getElementById('dateDisplay').textContent =
      `יום ${DAYS[now.getDay()]} | ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // עסקים
  async function loadBusinesses() {
    const data = await fetch('/api/businesses').then(r => r.json());
    const el = document.getElementById('bizScroll');
    if (!data.length) { el.innerHTML = '<div style="padding:20px;color:#aaa;text-align:center">אין עסקים עדיין</div>'; return; }
    const items = data.map(b => `
      <div class="biz-item">
        <div class="biz-info">
          <div class="biz-name">${b.name}</div>
          ${b.description ? `<div class="biz-desc">${b.description}</div>` : ''}
        </div>
        <div class="biz-room">חדר מס' ${b.office}</div>
      </div>
    `).join('');
    el.innerHTML = items + items; // כפול לאנימציה חלקה
  }
  loadBusinesses();
  setInterval(loadBusinesses, 60000);

  // עדכוני בניין
  async function loadUpdates() {
    const data = await fetch('/api/updates').then(r => r.json());
    const el = document.getElementById('updatesTicker');
    if (!data.length) return;
    const items = data.map(u => `<span class="update-item">${u.text}</span>`).join('');
    el.innerHTML = items + items;
  }
  loadUpdates();
  setInterval(loadUpdates, 5 * 60 * 1000);

  // פרסומות
  let adIndex = 0, adTimer = null, adsData = [];
  async function loadAds() {
    adsData = await fetch('/api/ads').then(r => r.json());
    renderAds();
  }
  function renderAds() {
    const container = document.getElementById('adSlides');
    const dots = document.getElementById('adDots');
    if (!adsData.length) {
      container.innerHTML = '';
      dots.innerHTML = '';
      return;
    }
    container.innerHTML = adsData.map((ad, i) => `
      <div class="ad-slide ${i===0?'active':''}" id="ad-${i}">
        ${ad.type==='video'
          ? `<video src="${ad.url}" autoplay muted loop></video>`
          : `<img src="${ad.url}" alt="${ad.title}">`}
      </div>
    `).join('');
    dots.innerHTML = adsData.map((_,i) =>
      `<div class="ad-dot ${i===0?'active':''}" id="dot-${i}"></div>`).join('');
    adIndex = 0;
    if (adTimer) clearTimeout(adTimer);
    scheduleNext();
  }
  function scheduleNext() {
    if (!adsData.length) return;
    adTimer = setTimeout(() => {
      document.getElementById('ad-'+adIndex)?.classList.remove('active');
      document.getElementById('dot-'+adIndex)?.classList.remove('active');
      adIndex = (adIndex+1) % adsData.length;
      document.getElementById('ad-'+adIndex)?.classList.add('active');
      document.getElementById('dot-'+adIndex)?.classList.add('active');
      scheduleNext();
    }, (adsData[adIndex].duration||6)*1000);
  }
  loadAds();
  setInterval(loadAds, 5*60*1000);

  // חדשות ynet
  async function loadNews() {
    const data = await fetch('/api/news').then(r => r.json());
    if (!data.length) return;
    const el = document.getElementById('newsTicker');
    const items = data.map(n => `<span class="news-item">${n}</span>`).join('');
    el.innerHTML = items + items;
  }
  loadNews();
  setInterval(loadNews, 5*60*1000);
</script>
</body>
</html>
