<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסך בניין</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f4f8;
    color: #1a2340;
    font-family: 'Heebo', Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== כותרת עליונה ===== */
  .top-bar {
    background: linear-gradient(135deg, #0d1b3e 0%, #1a3a6e 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 70px;
    flex-shrink: 0;
    box-shadow: 0 3px 16px rgba(13,27,62,0.35);
    position: relative;
    z-index: 10;
  }

  .building-name {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
  }
  .building-name svg { flex-shrink: 0; }

  .top-bar-center {
    flex: 1;
    overflow: hidden;
    margin: 0 28px;
    position: relative;
  }
  .top-bar-center::before,
  .top-bar-center::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 40px;
    z-index: 2;
  }
  .top-bar-center::before { right: 0; background: linear-gradient(to left, #1a3a6e, transparent); }
  .top-bar-center::after  { left:  0; background: linear-gradient(to right, #0d1b3e, transparent); }
  .updates-ticker {
    display: inline-block;
    white-space: nowrap;
    direction: ltr;
    will-change: transform;
  }
  .update-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-right: 60px;
    font-size: 0.88rem;
    font-weight: 400;
    color: rgba(255,255,255,0.82);
    direction: rtl;
  }
  .update-item::before {
    content: '◆';
    color: #5bc8f5;
    font-size: 0.6rem;
    flex-shrink: 0;
  }

  .datetime {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex-shrink: 0;
    min-width: 110px;
  }
  .datetime .time {
    font-size: 1.85rem;
    font-weight: 300;
    line-height: 1;
    color: #fff;
    letter-spacing: 2px;
  }
  .datetime .date {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.6);
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  /* ===== גוף ===== */
  .main-body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.85fr 1fr;
    gap: 14px;
    padding: 14px;
    min-height: 0;
  }

  /* ===== פאנל גנרי ===== */
  .panel {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 2px 16px rgba(13,27,62,0.10);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 18px;
    border-bottom: 1px solid #eef2f8;
    flex-shrink: 0;
  }
  .panel-header-icon {
    width: 30px; height: 30px;
    background: #e8f0fe;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #1a3a6e;
    font-size: 0.95rem;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: #1a2340;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ===== עסקים ===== */
  .biz-list {
    flex: 1;
    overflow: hidden;
    padding: 8px 10px;
  }
  .biz-scroll {
    animation: scrollUp 55s linear infinite;
  }
  .biz-scroll:hover { animation-play-state: paused; }
  @keyframes scrollUp {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  .biz-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    margin-bottom: 6px;
    border-radius: 10px;
    transition: background 0.2s;
    border-right: 3px solid transparent;
  }
  .biz-item:hover { background: #f5f8ff; }
  .biz-item.alt { background: #f9fafb; border-right-color: #3a8fd4; }
  .biz-item:not(.alt) { border-right-color: #e0e8f5; }
  .biz-info { display: flex; flex-direction: column; gap: 1px; flex: 1; }
  .biz-name { font-size: 0.92rem; font-weight: 600; color: #1a2340; line-height: 1.2; }
  .biz-desc { font-size: 0.68rem; color: #8a9ab5; font-weight: 400; }
  .biz-room {
    background: #e8f0fe;
    color: #1a3a6e;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    min-width: 52px;
    text-align: center;
    flex-shrink: 0;
    white-space: nowrap;
    line-height: 1.3;
  }

  /* ===== פרסומות ===== */
  .promo-panel {
    background: #0a0e1a;
    border-radius: 18px;
    box-shadow: 0 2px 20px rgba(13,27,62,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .promo-content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .ad-slide {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .ad-slide.active { display: flex; }
  .ad-slide img  { width: 100%; height: 100%; object-fit: cover; }
  .ad-slide video { width: 100%; height: 100%; object-fit: cover; }

  .no-ads {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #0d1b3e 0%, #1a2a5e 50%, #0a1228 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .no-ads-inner { text-align: center; padding: 32px; }
  .no-ads-label {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 4px;
    color: #5bc8f5; text-transform: uppercase; margin-bottom: 18px; opacity: 0.8;
  }
  .no-ads-main {
    font-size: 1.45rem; font-weight: 300; color: #fff;
    line-height: 1.6; margin-bottom: 24px;
  }
  .no-ads-phone {
    font-size: 1.9rem; font-weight: 700; color: #5bc8f5;
    letter-spacing: 1.5px; background: rgba(91,200,245,0.08);
    padding: 14px 28px; border-radius: 12px;
    border: 1px solid rgba(91,200,245,0.2); display: inline-block;
  }
  .no-ads-sub { margin-top: 16px; font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; }

  .ad-dots { display: flex; justify-content: center; gap: 6px; padding: 8px; flex-shrink: 0; }
  .ad-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
  .ad-dot.active { background: #5bc8f5; }

  .promo-contact-bar {
    background: rgba(91,200,245,0.07);
    border-top: 1px solid rgba(91,200,245,0.15);
    padding: 7px 16px;
    text-align: center;
    font-size: 0.74rem;
    color: #5bc8f5;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  /* ===== עדכוני בניין (ימין) ===== */
  .updates-panel .updates-list {
    flex: 1;
    overflow: hidden;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .update-card {
    background: #f5f8ff;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 9px;
    border-right: 3px solid #3a8fd4;
    position: relative;
    flex-shrink: 0;
  }
  .update-card-icon {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #3a8fd4;
    font-size: 0.8rem;
    opacity: 0.6;
  }
  .update-card p {
    font-size: 0.84rem;
    font-weight: 400;
    color: #2a3a5a;
    line-height: 1.5;
    padding-left: 20px;
  }
  .no-updates {
    text-align: center; color: #c0c8d8; padding: 30px; font-size: 0.9rem;
  }

  /* ===== רצועת חדשות תחתית ===== */
  /* ===== מזג אוויר ===== */
  .weather-panel { }
  .weather-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 14px;
    gap: 0;
    overflow: hidden;
  }
  .weather-current {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    padding: 10px 0 14px;
    border-bottom: 1px solid #eef2f8;
    flex-shrink: 0;
  }
  .weather-icon-big { font-size: 4rem; line-height: 1; }
  .weather-temp-big {
    font-size: 3rem;
    font-weight: 800;
    color: #1a2340;
    line-height: 1;
  }
  .weather-temp-big sup { font-size: 1.2rem; font-weight: 400; vertical-align: super; }
  .weather-desc { font-size: 0.88rem; color: #6a7a99; font-weight: 500; margin-top: 2px; }
  .weather-extra {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 6px;
  }
  .weather-extra-item { font-size: 0.75rem; color: #8a9ab5; display: flex; align-items: center; gap: 4px; }

  .weather-forecast {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 12px;
    flex: 1;
    overflow: hidden;
  }
  .forecast-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 10px;
    background: #f5f8ff;
    flex-shrink: 0;
  }
  .forecast-day { font-size: 0.82rem; font-weight: 600; color: #1a2340; min-width: 50px; }
  .forecast-icon { font-size: 1.3rem; }
  .forecast-temps { font-size: 0.82rem; color: #6a7a99; font-weight: 500; }
  .forecast-temps span { color: #1a2340; font-weight: 700; }

  .news-bar-wrap {
    flex-shrink: 0;
    position: relative;
  }
  .news-bar-wrap::before {
    content: '';
    position: absolute;
    top: -18px; left: 0; right: 0;
    height: 18px;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.06));
    pointer-events: none;
    z-index: 5;
  }
  .news-bar {
    background: #0d1b3e;
    color: #fff;
    height: 46px;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 -3px 20px rgba(13,27,62,0.25);
  }

  /* לוגו ynet */
  .ynet-logo {
    display: flex;
    align-items: center;
    padding: 0 18px;
    height: 100%;
    background: #e8001c;
    flex-shrink: 0;
    gap: 0;
  }
  .ynet-logo-y {
    font-size: 1.35rem;
    font-weight: 900;
    color: #fff;
    font-style: italic;
    letter-spacing: -1px;
    line-height: 1;
  }
  .ynet-logo-net {
    font-size: 0.82rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    line-height: 1;
    margin-top: 4px;
  }
  .ynet-logo-divider {
    width: 2px; height: 22px; background: rgba(255,255,255,0.3);
    margin: 0 12px;
  }
  .ynet-label-text {
    font-size: 0.72rem;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .news-ticker-wrap {
    flex: 1;
    overflow: hidden;
    margin: 0 12px;
    direction: ltr;
    position: relative;
  }
  .news-ticker-wrap::before {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 40px;
    background: linear-gradient(to left, #0d1b3e, transparent);
    z-index: 2;
    pointer-events: none;
  }
  .news-ticker {
    display: inline-block;
    white-space: nowrap;
    direction: ltr;
    font-size: 0.86rem;
    color: rgba(255,255,255,0.85);
    font-weight: 300;
    will-change: transform;
  }
  .news-item { display: inline-flex; align-items: center; gap: 8px; margin-right: 60px; direction: rtl; }
  .news-item::before { content: '◆'; color: #5bc8f5; font-size: 0.6rem; flex-shrink: 0; }
  .news-time {
    background: rgba(91,200,245,0.12);
    color: #5bc8f5;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid rgba(91,200,245,0.2);
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- כותרת עליונה -->
<div class="top-bar">
  <div class="building-name">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5bc8f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <span id="buildingName">מרכז עסקים</span>
  </div>

  <div class="top-bar-center">
    <div class="updates-ticker" id="updatesTicker" style="direction:ltr">
      <span class="update-item">ברוכים הבאים לבניין</span>
      <span class="update-item">ברוכים הבאים לבניין</span>
    </div>
  </div>

  <div class="datetime">
    <div class="time" id="clock">00:00</div>
    <div class="date" id="dateDisplay"></div>
  </div>
</div>

<!-- גוף ראשי -->
<div class="main-body">

  <!-- עסקים -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-header-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
      </div>
      <span class="panel-title">מדריך עסקים ומשרדים</span>
    </div>
    <div class="biz-list">
      <div class="biz-scroll" id="bizScroll"></div>
    </div>
  </div>

  <!-- פרסומות -->
  <div class="promo-panel">
    <div class="promo-content">
      <div id="promoPlaceholder" class="no-ads">
        <div class="no-ads-inner">
          <div class="no-ads-label">מקום פרסום</div>
          <div class="no-ads-main">פרסמו את העסק שלכם<br>על מסך הבניין</div>
          <div class="no-ads-phone">052-6060848</div>
          <div class="no-ads-sub">לפרסום כאן חייגו</div>
        </div>
      </div>
      <div id="adSlides"></div>
    </div>
    <div class="ad-dots" id="adDots"></div>
    <div class="promo-contact-bar">לפרסום העסק שלכם על מסך הבניין ◆ 052-6060848</div>
  </div>

  <!-- מזג אוויר -->
  <div class="panel weather-panel" id="weatherPanel">
    <div class="panel-header">
      <div class="panel-header-icon" style="background:#fff3e0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e67e22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </div>
      <span class="panel-title">מזג אוויר — תל אביב</span>
    </div>
    <div class="weather-body" id="weatherBody">
      <div style="text-align:center;color:#ccc;padding:30px;font-size:0.9rem">טוען...</div>
    </div>
  </div>

</div>

<!-- חדשות ynet -->
<div class="news-bar-wrap">
  <div class="news-bar">
    <div class="ynet-logo">
      <div style="display:flex;flex-direction:column;align-items:center;line-height:1">
        <span class="ynet-logo-y">y</span>
        <span class="ynet-logo-net">net</span>
      </div>
      <div class="ynet-logo-divider"></div>
      <span class="ynet-label-text">חדשות</span>
    </div>
    <div class="news-ticker-wrap">
      <div class="news-ticker" id="newsTicker">טוען חדשות...</div>
    </div>
  </div>
</div>

<script>
  const BID = location.pathname.split('/')[2] || '203991203';

  // שם בניין
  async function loadBuildingName() {
    const data = await fetch('/api/' + BID + '/settings').then(r => r.json()).catch(() => ({}));
    if (data.buildingName) document.getElementById('buildingName').textContent = data.buildingName;
  }
  loadBuildingName();
  setInterval(loadBuildingName, 30000);

  // ערכת נושא (שמורה לתאימות אחורה — לא משפיעה על עיצוב חדש)
  async function loadTheme() {
    // העיצוב החדש לא תלוי בערכת נושא
  }

  // שעון ותאריך
  const DAYS   = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m;
    document.getElementById('dateDisplay').textContent =
      `יום ${DAYS[now.getDay()]} | ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // עסקים
  async function loadBusinesses() {
    const data = await fetch('/api/' + BID + '/businesses').then(r => r.json());
    const el = document.getElementById('bizScroll');
    if (!data.length) { el.innerHTML = '<div style="padding:20px;color:#aaa;text-align:center;font-size:0.9rem">אין עסקים עדיין</div>'; return; }
    const items = data.map((b, i) => `
      <div class="biz-item${i % 2 === 1 ? ' alt' : ''}">
        <div class="biz-info">
          <div class="biz-name">${b.name}</div>
          ${b.description ? `<div class="biz-desc">${b.description}</div>` : ''}
        </div>
        <div class="biz-room">
          ${b.floor ? `<div style="font-size:0.64rem;opacity:0.7;font-weight:500">קומה ${b.floor}</div>` : ''}
          <div>חדר ${b.office}</div>
        </div>
      </div>
    `).join('');
    el.innerHTML = items + items;
  }
  loadBusinesses();
  setInterval(loadBusinesses, 60000);

  // עדכוני בניין — רק בסרגל העליון
  async function loadUpdates() {
    const data = await fetch('/api/' + BID + '/updates').then(r => r.json());
    if (!data.length) return;
    const items = data.map(u => `<span class="update-item">${u.text}</span>`).join('');
    updatesTicker.setContent(items + items);
  }
  loadUpdates();
  setInterval(loadUpdates, 5 * 60 * 1000);

  // מזג אוויר — Open-Meteo (חינמי, ללא API key)
  const WMO_DESC = {
    0:'שמיים בהירים', 1:'בהיר בעיקר', 2:'מעונן חלקית', 3:'מעונן',
    45:'ערפל', 48:'ערפל',
    51:'טפטוף קל', 53:'טפטוף', 55:'טפטוף כבד',
    61:'גשם קל', 63:'גשם', 65:'גשם כבד',
    71:'שלג קל', 73:'שלג', 75:'שלג כבד',
    80:'מקלחות גשם', 81:'מקלחות', 82:'מקלחות כבדות',
    95:'סופת רעמים', 96:'סופת רעמים', 99:'סופת רעמים'
  };
  const WMO_ICON = {
    0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
    45:'🌫️', 48:'🌫️',
    51:'🌦️', 53:'🌦️', 55:'🌧️',
    61:'🌧️', 63:'🌧️', 65:'🌧️',
    71:'🌨️', 73:'❄️', 75:'❄️',
    80:'🌦️', 81:'🌧️', 82:'⛈️',
    95:'⛈️', 96:'⛈️', 99:'⛈️'
  };
  const DAY_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

  function wmoIcon(code) { return WMO_ICON[code] || '🌡️'; }
  function wmoDesc(code) { return WMO_DESC[code] || ''; }

  async function loadWeather() {
    try {
      const url = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=32.0853&longitude=34.7818' +
        '&current=temperature_2m,weathercode,windspeed_10m,relative_humidity_2m' +
        '&daily=weathercode,temperature_2m_max,temperature_2m_min' +
        '&timezone=Asia%2FJerusalem&forecast_days=4';
      const data = await fetch(url).then(r => r.json());
      const cur  = data.current;
      const day  = data.daily;
      const temp = Math.round(cur.temperature_2m);
      const code = cur.weathercode;
      const wind = Math.round(cur.windspeed_10m);
      const hum  = cur.relative_humidity_2m;

      // תחזית 3 ימים נוספים (מחר ואילך)
      const forecastRows = [1,2,3].map(i => {
        const date  = new Date(day.time[i]);
        const label = DAY_SHORT[date.getDay()];
        const max   = Math.round(day.temperature_2m_max[i]);
        const min   = Math.round(day.temperature_2m_min[i]);
        const ic    = wmoIcon(day.weathercode[i]);
        return `<div class="forecast-row">
          <span class="forecast-day">${label}</span>
          <span class="forecast-icon">${ic}</span>
          <span class="forecast-temps"><span>${max}°</span> / ${min}°</span>
        </div>`;
      }).join('');

      document.getElementById('weatherBody').innerHTML = `
        <div class="weather-current">
          <div class="weather-icon-big">${wmoIcon(code)}</div>
          <div class="weather-temp-big">${temp}<sup>°C</sup></div>
          <div class="weather-desc">${wmoDesc(code)}</div>
          <div class="weather-extra">
            <span class="weather-extra-item">💧 ${hum}%</span>
            <span class="weather-extra-item">💨 ${wind} קמ"ש</span>
          </div>
        </div>
        <div class="weather-forecast">${forecastRows}</div>
      `;
    } catch(e) {
      document.getElementById('weatherBody').innerHTML =
        '<div style="text-align:center;color:#ccc;padding:20px;font-size:0.85rem">לא ניתן לטעון מזג אוויר</div>';
    }
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  // פרסומות
  let adIndex = 0, adTimer = null, adsData = [];
  async function loadAds() {
    adsData = await fetch('/api/' + BID + '/ads').then(r => r.json());
    renderAds();
  }
  function renderAds() {
    const container = document.getElementById('adSlides');
    const dots = document.getElementById('adDots');
    const placeholder = document.getElementById('promoPlaceholder');
    if (!adsData.length) {
      container.innerHTML = '';
      dots.innerHTML = '';
      placeholder.style.display = 'flex';
      return;
    }
    placeholder.style.display = 'none';
    container.innerHTML = adsData.map((ad, i) => `
      <div class="ad-slide ${i===0?'active':''}" id="ad-${i}">
        ${ad.type==='video'
          ? `<video src="${ad.url}" autoplay muted loop></video>`
          : `<img src="${ad.url}" alt="${ad.title}">`}
      </div>
    `).join('');
    dots.innerHTML = adsData.map((_,i) =>
      `<div class="ad-dot ${i===0?'active':''}" id="dot-${i}"></div>`).join('');
    adIndex = 0;
    if (adTimer) clearTimeout(adTimer);
    scheduleNext();
  }
  function scheduleNext() {
    if (!adsData.length) return;
    adTimer = setTimeout(() => {
      document.getElementById('ad-'+adIndex)?.classList.remove('active');
      document.getElementById('dot-'+adIndex)?.classList.remove('active');
      adIndex = (adIndex+1) % adsData.length;
      document.getElementById('ad-'+adIndex)?.classList.add('active');
      document.getElementById('dot-'+adIndex)?.classList.add('active');
      scheduleNext();
    }, (adsData[adIndex].duration||6)*1000);
  }
  loadAds();
  setInterval(loadAds, 5*60*1000);

  // מנוע גלילה
  function createTicker(elId, speed) {
    let x = 0, halfW = 0, raf = null;
    const el = () => document.getElementById(elId);
    function step(lastTs) {
      return function(ts) {
        const dt = Math.min((ts - lastTs) / 1000, 0.1);
        x -= speed * dt;
        if (halfW > 0) {
          if (speed > 0 && x <= -halfW) x += halfW;
          if (speed < 0 && x >= 0)      x -= halfW;
        }
        el().style.transform = `translateX(${x}px)`;
        raf = requestAnimationFrame(step(ts));
      };
    }
    function start() {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(ts => { raf = requestAnimationFrame(step(ts)); });
    }
    function setContent(html) {
      el().innerHTML = html;
      requestAnimationFrame(() => {
        halfW = el().scrollWidth / 2;
        if (speed < 0) x = -halfW;
      });
    }
    return { start, setContent };
  }

  const newsTicker    = createTicker('newsTicker',    -55);
  const updatesTicker = createTicker('updatesTicker', -45);
  newsTicker.start();
  updatesTicker.start();

  // חדשות ynet
  function fmtTime(pubDate) {
    if (!pubDate) return '';
    const d = new Date(pubDate);
    if (isNaN(d)) return '';
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  async function loadNews() {
    const data = await fetch('/api/news').then(r => r.json()).catch(() => []);
    if (!data.length) return;
    const makeItems = () => data.map(n => {
      const t    = typeof n === 'object' ? n.title : n;
      const time = typeof n === 'object' ? fmtTime(n.pubDate) : '';
      return `<span class="news-item">${time ? `<span class="news-time">${time}</span>` : ''}${t}</span>`;
    }).join('');
    newsTicker.setContent(makeItems() + makeItems());
  }
  loadNews();
  setInterval(loadNews, 2 * 60 * 1000);

  // רענון כל 10 דקות
  setInterval(() => location.reload(), 10 * 60 * 1000);
</script>
